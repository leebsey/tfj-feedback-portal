<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#14384C" />
  <title>TF Jones | Feedback Portal</title>
  <meta name="description" content="TF Jones feedback portal – share feedback or leave a Google review." />

  <style>
    :root{
      --navy:#14384C;
      --neon:#EDFF1C;
      --mint:#BFF3D0;
      --ink:#0b1f2b;
      --line: rgba(11,31,43,.14);
      --shadow: 0 18px 50px rgba(11,31,43,.18);
      --radius: 20px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--ink);
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfd 100%);
    }

    .container{
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 16px 40px;
      display:flex;
      flex-direction:column;
      gap: 18px;
    }

    /* Header */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 10px 4px;
    }

    .brand a{
      display:inline-block;
    }

    .brand img{
      width: 220px;
      display:block;
    }

    .smallTag{
      font-size: 13px;
      font-weight: 650;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(20,56,76,.05);
      border: 1px solid rgba(20,56,76,.12);
    }

    /* Hero */
    .hero{
      background: var(--mint);
      border-radius: 26px;
      padding: 26px;
      display:grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 22px;
      box-shadow: 0 22px 60px rgba(11,31,43,.14);
      position:relative;
      overflow:hidden;
    }

    .hero:after{
      content:"";
      position:absolute;
      right: 44px;
      top: 44px;
      width: 72px;
      height: 72px;
      background: var(--neon);
      border-radius: 14px;
    }

    .hero h1{
      margin: 90px 0 0;
      font-size: clamp(36px, 5vw, 56px);
      color: var(--navy);
      letter-spacing:-0.8px;
    }

    .hero p{
      margin: 14px 0 0;
      max-width: 60ch;
      line-height: 1.55;
    }

    .ctaRow{
      margin-top: 22px;
      max-width: 420px;
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .btn{
      display:flex;
      justify-content:center;
      align-items:center;
      padding: 16px;
      border-radius: 14px;
      text-decoration:none;
      font-weight: 800;
      box-shadow: 0 10px 26px rgba(11,31,43,.10);
      border: 1px solid rgba(20,56,76,.22);
      font-size: 15px;
      text-align:center;
      white-space: nowrap;
    }

    .btnPrimary{
      background: var(--navy);
      color:#fff;
    }

    .btnSecondary{
      background:#fff;
      color: var(--navy);
    }

    /* Photos */
    .photos{
      display:grid;
      gap: 14px;
      z-index:1;
    }

    .photo{
      border-radius: 22px;
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(11,31,43,.14);
      border: 1px solid rgba(11,31,43,.14);
      /* default aspect ratio is free on desktop */
    }

    .photo img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .photo.small{
      transform: translateX(-26px);
    }

    @media(max-width:860px){
      .hero{ grid-template-columns:1fr; }
      .photo.small{ transform:none; }
      .brand img{ width:190px; }
      .hero h1{ margin-top: 40px; }
    }

    /* ✅ Mobile-specific polish */
    @media (max-width:600px){
      /* Move/shrink neon square so it never overlaps the title */
      .hero:after{
        right: 14px;
        top: 14px;
        width: 46px;
        height: 46px;
        border-radius: 12px;
      }

      /* Pull the headline up so it feels less “pushed down” */
      .hero{
        padding: 18px;
      }
      .hero h1{
        margin: 26px 0 0;
        font-size: 42px;
      }

      /* Buttons stay chunky but slightly tighter */
      .ctaRow{
        max-width: 100%;
        gap: 12px;
      }
      .btn{
        padding: 14px;
        font-size: 15px;
      }

      /* Make photos shorter (less scrolling) */
      .photo{
        aspect-ratio: 16 / 9;
      }
      .photo img{
        height: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <a href="https://www.tfjones.com" target="_blank" rel="noopener">
          <img src="logo-blue.png" alt="TF Jones" />
        </a>
      </div>
      <div class="smallTag">Feedback Portal</div>
    </div>

    <section class="hero">
      <div>
        <h1>How did we do?</h1>
        <p>
          We’re always looking to improve. If you have feedback (good or bad), send it directly to us.
          If you’d like to leave a public review, you can do that too.
        </p>

        <div class="ctaRow">
          <a class="btn btnPrimary"
             href="mailto:info@tfjones.co.uk?subject=Feedback%20for%20TF%20Jones">
            We Can Do Better
          </a>

          <a class="btn btnSecondary"
             href="https://tinyurl.com/28yfmzr6"
             target="_blank"
             rel="noopener">
            We Did a Good Job
          </a>
        </div>
      </div>

      <div class="photos">
        <div class="photo">
          <img src="work pic.png" alt="TF Jones team at work" />
        </div>
        <div class="photo small">
          <img src="Van pic.png" alt="TF Jones vans" />
        </div>
      </div>
    </section>
  </div>
</body>
</html>
